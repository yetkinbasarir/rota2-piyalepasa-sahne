      #ld-ui { position: absolute; inset: 0; pointer-events: none; opacity: 0; }

        #ld-logo { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); width: min(86vw, calc(45vh * 1.6127)); }
