<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Safari'nin üst çubuk alanı her zaman siyah -->
    <meta name="theme-color" content="#ECEBE8" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEBE8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ECEBE8" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Piyalepaşa" />
    <meta name="description" content="Piyalepaşa Sahne programı" />
    <title>Piyalepaşa Sahne</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <!-- tam ekran videoları: bağlantılar önceden açılır (sayfa / görsel sunucuları CORS'suz, video akışı CORS'lu) -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://www.googlevideo.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googlevideo.com" />
    <link rel="preconnect" href="https://player.vimeo.com" />
    <link rel="dns-prefetch" href="https://player.vimeo.com" />
    <link rel="preconnect" href="https://i.vimeocdn.com" />
    <link rel="dns-prefetch" href="https://i.vimeocdn.com" />
    <link rel="preconnect" href="https://vod-adaptive-ak.vimeocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://vod-adaptive-ak.vimeocdn.com" />
    <link rel="stylesheet" href="https://use.typekit.net/fpj2hxb.css" />
    <style>html,body{background:#ECEBE8;margin:0;overscroll-behavior:none}</style>
    <style>
      /* ilk ekran (JS paketini beklemeden görünür): tam ekran düz siyah; motor içine daireleri, QR'ı yerleştirir */
      /* görünür alan yüksekliğinde (100dvh; iOS Safari'nin araç çubuğu boşluk bırakmasın) */
      #ld { position: fixed; left: 0; right: 0; top: 0; height: 100vh; height: 100dvh; z-index: 3000; background: #000; overflow: hidden; touch-action: none; cursor: default; }
      #ld-c, #ld-ui { position: absolute; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- ilk ekran: siyah zemin, süzülen daireler, QR (motor yönetir) -->
    <div id="ld" aria-hidden="true"><div id="ld-c"></div><div id="ld-ui"></div></div>
    <div id="app"></div>
    <noscript><p style="color:#fff;font:16px sans-serif;padding:20px">Piyalepaşa Sahne için JavaScript gerekli.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
