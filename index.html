      #ld-logo .ld-dots canvas { display: block; width: 100%; height: 100%; }
      #ld-ui { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
      @media (max-width: 760px) and (orientation: portrait) {
        #ld-logo { left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); width: min(86vw, calc(45vh * 1.9168)); }
