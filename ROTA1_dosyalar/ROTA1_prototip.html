<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piyalepaşa Sahne prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
/* VOICE: kurum kendi ekranında, sessiz ve emin
   IDEA: katlanmış afiş; 16:9 birimlerden örülmüş kesintisiz yüzey
   PICTURE: yüzeyin kendisi; birim açılınca sayfa olur
   COLOUR and TYPE: ROTA1 artboard renkleri, siyah zemin, grotesk
   LAYOUT: birim = ekran / kolon, oran 16:9 */
:root{color-scheme:dark;--f:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;--rw:100vw;--rh:56vw;--it:0px;--ib:0px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;overscroll-behavior:none}
body{font-family:var(--f);color:#0b0b0b;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid #DA00F9;outline-offset:3px}
#plane{position:fixed;inset:0;overflow:hidden;cursor:grab}
#plane.drag{cursor:grabbing}
.t{position:absolute;left:0;top:0;overflow:hidden}
.lp{position:absolute;inset:0;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0)) no-repeat;background-size:60% 90%;animation:sweep 9s ease-in-out infinite alternate;mix-blend-mode:soft-light}
@keyframes sweep{from{background-position:0% 20%}to{background-position:100% 80%}}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08);mix-blend-mode:multiply;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-2%,-1%)}}
.cap{position:absolute;left:5%;right:5%;bottom:7%;font-size:clamp(13px,1.05vw,16px);line-height:1.2}
.cap b{display:block;font-weight:700;font-size:1.3em;letter-spacing:-.01em}
.cap span{opacity:.7}
/* sayfa (kapak) */
.pg{color:#0b0b0b;position:absolute;left:0;top:0;width:var(--rw);height:var(--rh);overflow:hidden;background:#000}
.vis{position:absolute;overflow:hidden}
.d .side{position:absolute;left:0;top:0;bottom:0;width:25%;background:#fff;padding:calc(var(--it) + 1.6vw) 1.4vw calc(var(--ib) + 1.6vw)}
.d .vis{left:25%;right:0;top:0;bottom:0}
.d h1{font-weight:300;line-height:.92;letter-spacing:-.03em}
.logo{position:absolute;left:1.4vw;bottom:calc(var(--ib) + 1.4vw);line-height:1}
.logo b{display:block;font-weight:700;font-size:6.4vw;letter-spacing:-.05em}
.logo i{position:absolute;right:-.2em;top:-.55em;font:400 2.3vw/1 Yellowtail,cursive}
.m .vis{left:0;right:0;top:0;height:52%}
.m .side{position:absolute;left:0;right:0;top:52%;bottom:0;background:#fff;padding:20px 20px calc(var(--ib) + 20px)}
.m .side::before{content:"";display:block;border-top:2px solid #0b0b0b;margin-bottom:16px}
.m h1{font-weight:700;line-height:.98;letter-spacing:-.035em}
.m .sub{font-size:22px;font-weight:300;letter-spacing:-.02em;margin-top:2px}
.m .logo{left:20px;top:calc(var(--it) + 16px);bottom:auto;color:#fff}
.m .logo b{font-size:34px}.m .logo i{font-size:15px}
.m .row{position:absolute;left:20px;right:20px;bottom:calc(var(--ib) + 20px)}
/* simgeler ve aksiyon satırı */
.row{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #0b0b0b;padding-bottom:12px}
.row .pr{font-size:22px;letter-spacing:.04em}
.ic{width:48px;height:48px;display:grid;place-items:center}
.ic svg{width:44px;height:44px;stroke:#0b0b0b;stroke-width:2;fill:none}
/* açık görünüm */
#ov{position:fixed;inset:0;overflow:hidden;display:none}
#ov.on{display:block}
#track{position:absolute;inset:0;transition:transform .75s cubic-bezier(.7,0,.2,1)}
.lv{position:absolute;left:0;width:100%;height:100%}
.l1,.l2{background:#fff}.l1{top:100%}.l2{top:200%}
#cv{position:absolute;left:0;width:var(--rw);height:var(--rh);overflow:hidden}
.dw{position:absolute;inset:0;display:grid;grid-template-columns:25% 1fr;column-gap:2.4vw;padding:5vh 1.4vw}
.dw .hd{border-top:2px solid #0b0b0b;padding-top:14px}
.dw h2{font-weight:700;font-size:clamp(30px,3.4vw,58px);line-height:.98;letter-spacing:-.035em;text-wrap:balance}
.dw .sub{font-weight:300;font-size:clamp(20px,1.9vw,32px);letter-spacing:-.02em;margin-top:4px}
.bd{border-top:2px solid #0b0b0b;padding-top:14px;display:flex;flex-direction:column;gap:28px;max-width:760px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px 24px}
dt{font-size:13px;font-weight:700;letter-spacing:.08em}
dd{font-size:clamp(18px,1.5vw,24px);font-weight:700;letter-spacing:-.015em;margin-top:2px;white-space:nowrap}
.ds{display:flex;flex-wrap:wrap;gap:10px}
.ds button{border:2px solid #0b0b0b;padding:12px 16px;font-weight:700;font-size:16px;min-height:48px}
.ds button[aria-pressed=true]{background:#0b0b0b;color:#fff}
.qt{display:flex;align-items:center;gap:18px;font-size:24px;font-weight:700}
.qt button{width:48px;height:48px;border:2px solid #0b0b0b;font-size:24px;line-height:1}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #0b0b0b;padding-top:12px;font-size:20px}
.tot b{font-size:30px;white-space:nowrap}
.go{background:#0b0b0b;color:#fff;font-weight:700;font-size:18px;padding:16px 28px;min-height:52px;align-self:flex-start}
.note{font-size:13px;opacity:.55}
.msg{font-size:15px;min-height:1.2em}
@media(max-width:639px){.dw{grid-template-columns:1fr;align-content:start;row-gap:22px;padding:24px 20px}.bd{gap:22px}.dw h2{font-size:38px}}
/* katlanma */
#fd{position:fixed;left:0;width:var(--rw);height:var(--rh);perspective:2200px;transform-style:preserve-3d;pointer-events:none;display:none}
.st{position:absolute;left:0;width:100%;transform-style:preserve-3d}
.pn{position:absolute;top:0;transform-style:preserve-3d}
.fr,.bk{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bk{background:linear-gradient(135deg,#e4e4e4,#c9c9c9)}
.pn>.bk{transform:rotateY(180deg)}.st>.bk{transform:rotateX(180deg)}
.sh{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.lg{position:relative;display:inline-block;color:#fff;line-height:1;white-space:nowrap}
.t .pg{width:100%;height:100%;--it:0px;--ib:0px}
.t .cap,.t .pg{animation:fi .35s ease-out both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.z-mi .lp,.z-mi .cap{display:none}
#fr{position:fixed;left:0;top:0;border:3px solid #fff;box-shadow:0 0 0 2px #000 inset;pointer-events:none;display:none;z-index:2;transform-origin:0 0}
.zc{position:fixed;left:14px;bottom:14px;z-index:5;display:flex;gap:6px}
.zc button{width:44px;height:44px;background:rgba(0,0,0,.62);display:grid;place-items:center}
.zc button[aria-pressed=true]{background:#fff}
.zc svg{width:22px;height:22px;fill:#fff}.zc button[aria-pressed=true] svg{fill:#000}
#ov{transition:opacity .3s}#ov.fade{opacity:0}
.lg b{display:block;font-weight:700;letter-spacing:-.05em}
.lg i{position:absolute;right:-.12em;top:-.5em;font-family:Yellowtail,cursive;font-weight:400;letter-spacing:0}
.hint{position:fixed;right:14px;bottom:14px;z-index:5;font-size:13px;color:#fff;background:rgba(0,0,0,.62);padding:8px 12px;pointer-events:none;transition:opacity .4s}
@media(prefers-reduced-motion:reduce){.lp,.ph{animation:none}#track{transition-duration:.01s}}
</style></head>
<body>
<div id="plane" aria-label="Program yüzeyi"></div>
<div id="fd"></div>
<div id="ov" role="dialog" aria-label="Gösteri">
  <div id="track">
    <div class="lv l0"><div id="cv"></div></div>
    <div class="lv l1" id="dt"></div>
    <div class="lv l2" id="bu"></div>
  </div>
</div>
<div id="fr"></div>
<div class="zc" id="zc"><button data-l="0" aria-label="Çoklu küçük görünüm"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="6" height="6"/><rect x="8" y="1" width="6" height="6"/><rect x="15" y="1" width="6" height="6"/><rect x="1" y="8" width="6" height="6"/><rect x="8" y="8" width="6" height="6"/><rect x="15" y="8" width="6" height="6"/><rect x="1" y="15" width="6" height="6"/><rect x="8" y="15" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/></svg></button><button data-l="1" aria-label="Mozaik görünüm"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="9" height="9"/><rect x="12" y="1" width="9" height="9"/><rect x="1" y="12" width="9" height="9"/><rect x="12" y="12" width="9" height="9"/></svg></button><button data-l="2" aria-label="Tam ekran"><svg viewBox="0 0 22 22"><rect x="1" y="1" width="20" height="20"/></svg></button></div>
<div class="hint" id="hint"></div>

async function setLevel(li,ax=S.vw/2,ay=S.vh/2,ms=560){
  li=clamp(li,0,2);const n1=LV[li],W=Wn(S.n),H=Hn(S.n),ua=S.cu+ax/W,va=S.cv+ay/H;
  let cu1=Math.round(ua-ax/Wn(n1)),cv1=snapV(va-ay/Hn(n1),n1);
  if(n1===1){cu1=Math.floor(ua);cv1=Math.floor(va)-vOff(1)}
  vel={x:0,y:0};await viewTo(n1,cu1,cv1,T(ms));S.n=n1;if(S.li!==li){S.li=li;rebuild()}syncZC();
}
function settle(ms=380){if(S.mode!=='surface')return;
  const li=LV.reduce((b,n,k)=>Math.abs(Math.log(S.n/n))<Math.abs(Math.log(S.n/LV[b]))?k:b,0);
  if(Math.abs(S.n-LV[li])>1e-3)return setLevel(li,pinchA.x,pinchA.y,ms);
  viewTo(S.n,Math.round(S.cu),snapV(S.cv,S.n),T(ms));
}

/* ---------- çizim ---------- */
const $=s=>document.querySelector(s), plane=$('#plane'), fd=$('#fd'), ov=$('#ov'), track=$('#track'), cv=$('#cv'), dt=$('#dt'), bu=$('#bu'), hint=$('#hint'), fr=$('#fr'), zc=$('#zc');
const LOGO=s=>`<div class="lg" style="font-size:${s}px"><i style="font-size:.36em">Piyalepaşa</i><b>Sahne</b></div>`;
const SV={no:'<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="15"/><path d="M6 38 38 6"/></svg>',
 go:'<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="14"/><path d="M22 1v42M1 22h42"/></svg>'};
const visual=(p,c)=>`<div class="vis" style="background:${c}">${p.k===3?`<img class="ph" src="${IMG}" alt="">`:''}<div class="lp"></div></div>`;
function tsize(p){const lw=Math.max(...p.t.split(/\s+/).map(w=>w.length));
  return S.m?Math.min(S.vw*.13,(S.vw-40)/(lw*.56)):Math.min(S.vw*.06,(S.vw*.25-S.vw*.028)/(lw*.5))}
function page(x){const p=x.p,t=esc(p.t),logo='<div class="logo"><i>Piyalepaşa</i><b>Sahne</b></div>';
  if(S.m)return `<div class="pg m">${visual(p,x.c)}${logo}<div class="side"><h1 style="font-size:${tsize(p)}px">${t}</h1><p class="sub">${esc(p.g)}</p>
   <div class="row"><span class="ic">${SV.no}</span><span class="pr">${tl(price(p))}</span><span class="ic">${SV.go}</span></div></div></div>`;
  return `<div class="pg d"><div class="side"><h1 style="font-size:${tsize(p)}px">${t.replace(/ /g,'<br>')}</h1>${logo}</div>${visual(p,x.c)}</div>`}
let pool=new Map(), baseN=3;
function tile(i,j){
  const x=cell(i,j),W=Wn(baseN),H=Hn(baseN),lvl=CLS[S.li];if(x.type==='x')return null;
  const el=document.createElement('div');el.className='t';const span=x.type==='span',w=span?3*W:W;
  el.style.cssText=`width:${w+1}px;height:${H+1}px;background:${x.c||'#000'};color:${x.c?ink(x.c,x.p):'#fff'}`;
  if(x.type==='k')return el;
  if(x.type==='lh'||span){el.innerHTML=`<div style="position:absolute;left:${w*.05}px;bottom:${H*.05}px">${LOGO(w*.88/2.62)}</div>`;return el}
  if(x.type==='ls'){el.innerHTML=`<div style="position:absolute;right:${W*.05}px;bottom:${H*.03}px">${LOGO(W*.88/2.62)}</div>`;return el}
  if(x.type==='lr'){const z=H*.86/2.62;el.innerHTML=`<div style="position:absolute;right:${W*.03}px;top:50%;width:${z*1.2}px"><div style="position:absolute;left:50%;top:0;transform:translate(-50%,-50%) rotate(-90deg)">${LOGO(z)}</div></div>`;return el}
  const p=x.p;
  if(lvl==='ma'){el.innerHTML=page(x);return el}
  el.innerHTML=(p.k===3?`<img class="ph" src="${IMG}" alt="">`:'')+`<div class="lp" style="animation-delay:-${mod(i*3+j*5,9)}s"></div><div class="cap"><b>${esc(p.t)}</b><span>${p.s} · ${esc(p.g)}</span></div>`;
  return el;
}
function rebuild(){pool.forEach(e=>e.remove());pool.clear();baseN=LV[S.li];plane.className='z-'+CLS[S.li]}
function render(){
  const W=Wn(S.n),H=Hn(S.n),k=W/Wn(baseN),i0=Math.floor(S.cu)-3,i1=Math.floor(S.cu+S.n)+1,j0=Math.floor(S.cv)-1,j1=Math.floor(S.cv+S.vh/H)+1,seen=new Set();
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const key=i+','+j;let el=pool.get(key);
    if(!el){el=tile(i,j);if(!el)continue;el.style.transformOrigin='0 0';plane.append(el);pool.set(key,el)}
    el.style.transform=`translate3d(${(i-S.cu)*W}px,${(j-S.cv)*H}px,0) scale(${k})`;seen.add(key)}
  for(const [key,el] of pool)if(!seen.has(key)){el.remove();pool.delete(key)}
  if(S.kb&&S.mode==='surface'&&S.li<2){const f=cell(S.focus.i,S.focus.j),w=(f.type==='span'?3:1)*W;fr.style.display='block';
    fr.style.width=w+'px';fr.style.height=H+'px';fr.style.transform=`translate3d(${(f.i-S.cu)*W}px,${(S.focus.j-S.cv)*H}px,0)`}
  else fr.style.display='none';
}
let vel={x:0,y:0},last=performance.now();
function tick(now){const d=Math.min(40,now-last);last=now;
  if(anim)anim(now);
  else if(!drag&&(Math.abs(vel.x)>2e-5||Math.abs(vel.y)>2e-5)){S.cu-=vel.x*d;S.cv-=vel.y*d;const f=.94**(d/16);vel.x*=f;vel.y*=f;
    if(Math.abs(vel.x)<=2e-5&&Math.abs(vel.y)<=2e-5)settle()}
  render();requestAnimationFrame(tick)}

/* ---------- komutlar (tüm girişler bunları çağırır) ---------- */
let busy=false;
const CMD={
  pan(dx,dy){S.cu-=dx/Wn(S.n);S.cv-=dy/Hn(S.n)},
  zoomBy(f,ax,ay){const W=Wn(S.n),H=Hn(S.n),ua=S.cu+ax/W,va=S.cv+ay/H;S.n=clamp(S.n*f,1,9);S.cu=ua-ax/Wn(S.n);S.cv=va-ay/Hn(S.n)},
  level(d,ax,ay){if(!busy)setLevel(S.li+d,ax,ay)},
  async activate(i,j){if(busy)return;const x=cell(i,j);S.focus={i:x.i,j};
    if(S.li===0){busy=true;const n1=3,off=(S.vh-3*Hn(3))/2/Hn(3);await viewTo(n1,x.i-1,j-1-off,T(600));S.n=3;S.li=1;rebuild();syncZC();busy=false;return}
    if(x.type!=='c')return;
    if(S.li===1)return openFold(x.i,j);
    openMacro(x.i,j)},
  move(dx,dy){if(busy)return;S.kb=true;let {i,j}=S.focus;
    for(let n=0;n<6;n++){i+=dx;j+=dy;if(cell(i,j).type==='c')break}
    S.focus={i:cell(i,j).i,j};
    const n=S.n,vis=Math.floor(S.vh/Hn(n));let cu=S.cu,cv=S.cv;
    if(S.li===2){cu=S.focus.i;cv=j-vOff(1)}
    else{if(i<cu)cu=i;if(i>cu+n-1)cu=i-n+1;if(j<cv)cv=j;if(j>cv+vis-1)cv=j-vis+1;cu=Math.round(cu);cv=Math.round(cv)}
    viewTo(n,cu,cv,T(420))},
  ok(){CMD.activate(S.focus.i,S.focus.j)},
  back(){if(S.mode==='open')return lvl(depth-1);CMD.level(-1,...fcenter())},
};
const fcenter=()=>[(S.focus.i-S.cu+.5)*Wn(S.n),(S.focus.j-S.cv+.5)*Hn(S.n)];

/* ---------- katlanarak açılma (3×3 bölge) ---------- */
const DUR=RM?1:540,OVL=.55,EZ='cubic-bezier(.62,0,.24,1)';
let region={top:0,rw:0,rh:0},openAt=null,openFrom='fold',depth=0;
function setRegion(top,rh){region={top,rw:S.vw,rh};const s=document.documentElement.style;
  s.setProperty('--rw',S.vw+'px');s.setProperty('--rh',rh+'px');
  s.setProperty('--it',Math.max(0,-top)+'px');s.setProperty('--ib',Math.max(0,top+rh-S.vh)+'px');fd.style.top=cv.style.top=top+'px'}
function buildFold(x){
  const W=Wn(3),H=Hn(3),html=page(x);fd.innerHTML='';const strips=[];
  for(let r=0;r<3;r++){const st=document.createElement('div');st.className='st';st.style.cssText=`top:${r*H}px;height:${H+.5}px`;
    st.style.transformOrigin=r<1?'50% 100%':'50% 0%';if(r!==1){const b=document.createElement('div');b.className='bk';st.append(b)}
    const pns=[];
    for(let c=0;c<3;c++){const pn=document.createElement('div');pn.className='pn';pn.style.cssText=`left:${c*W}px;width:${W+.5}px;height:${H+.5}px`;
      pn.style.transformOrigin=c<1?'100% 50%':'0% 50%';
      pn.innerHTML=`<div class="fr"><div style="position:absolute;left:${-c*W}px;top:${-r*H}px">${html}</div><div class="sh"></div></div>${r===1&&c!==1?'<div class="bk"></div>':''}`;
      st.append(pn);pns.push(pn)}
    fd.append(st);strips.push({st,pns})}
  fd.style.display='block';
  return [{el:strips[1].pns[0],from:'rotateY(180deg)'},{el:strips[1].pns[2],from:'rotateY(-180deg)'},{el:strips[0].st,from:'rotateX(-180deg)'},{el:strips[2].st,from:'rotateX(180deg)'}];
}
function play(steps,opening){
  const order=opening?steps:[...steps].reverse(),gap=DUR*OVL;steps.forEach(s=>s.el.style.visibility=opening?'hidden':'visible');
  return Promise.all(order.map((s,n)=>new Promise(res=>setTimeout(()=>{s.el.style.visibility='visible';
    const o={duration:DUR,easing:EZ,fill:'forwards',direction:opening?'normal':'reverse'};
    const a=s.el.animate([{transform:s.from},{transform:'none'}],o);s.el.querySelectorAll('.sh').forEach(h=>h.animate([{opacity:.55},{opacity:0}],o));
    a.onfinish=()=>{if(!opening)s.el.style.visibility='hidden';res()}},n*gap))))}
async function openFold(i,j){
  busy=true;const H=Hn(3),top=Math.round((S.vh-3*H)/2);
  await viewTo(3,i-1,j-1-top/H,T(420));setRegion(top,3*H);openAt={i,j};openFrom='fold';
  await play(buildFold(cell(i,j)),true);showOpen();fd.style.display='none';fd.innerHTML='';busy=false}
function openMacro(i,j){busy=true;const top=Math.round((j-S.cv)*Hn(1));setRegion(top,Hn(1));openAt={i,j};openFrom='macro';showOpen();busy=false}
function showOpen(){const x=cell(openAt.i,openAt.j);cv.innerHTML=page(x);fill(x.p);depth=0;S.mode='open';
  track.style.transition='none';track.style.transform='none';track.offsetHeight;track.style.transition='';ov.classList.remove('fade');ov.classList.add('on');
  say(S.m?'← → yeni içerik · ↑ detay · ↓ ana ekran':'← → yeni içerik · aşağı kaydır: detay · yukarı: ana ekran')}
async function closeOpen(){
  if(busy)return;busy=true;S.focus={i:openAt.i,j:openAt.j};
  if(openFrom==='fold'){const steps=buildFold(cell(openAt.i,openAt.j));steps.forEach(s=>s.el.style.visibility='visible');ov.classList.remove('on');cv.innerHTML='';
    await play(steps,false);fd.style.display='none';fd.innerHTML=''}
  else{ov.classList.add('fade');await new Promise(r=>setTimeout(r,T(300)));ov.classList.remove('on')}
  openAt=null;S.mode='surface';busy=false}
function lvl(n){if(busy)return;if(n<0)return closeOpen();depth=Math.min(2,n);track.style.transform=`translateY(${-depth*100}%)`}
async function shift(d){
  if(busy||depth)return;busy=true;let s=openAt.i;for(let n=0;n<9;n++){s+=d;if(cell(s,openAt.j).type==='c')break}
  const dist=s-openAt.i;openAt.i=s;const x=cell(s,openAt.j),old=cv.firstElementChild,w=document.createElement('div');w.innerHTML=page(x);const nw=w.firstElementChild;cv.append(nw);
  const o={duration:T(680),easing:EZ,fill:'forwards'};
  old.animate([{transform:'none'},{transform:`translateX(${-d*100}%)`}],o);const a=nw.animate([{transform:`translateX(${d*100}%)`},{transform:'none'}],o);
  viewTo(S.n,S.cu+dist,S.cv,T(680));await a.finished;old.remove();fill(x.p);busy=false}
function fill(p){
  const ds=dates(p),pr=price(p),head=`<div class="hd"><h2>${esc(p.t)}</h2><p class="sub">${esc(p.g)}</p></div>`;
  dt.innerHTML=`<div class="dw">${head}<div class="bd"><dl><div><dt>SAHNE</dt><dd>${p.s}</dd></div><div><dt>TARİH</dt><dd>${ds[0]}</dd></div><div><dt>SAAT</dt><dd>20.30</dd></div><div><dt>SÜRE</dt><dd>${90+p.k%4*15} dk</dd></div></dl>
   <div class="row"><button class="ic" data-a="back" aria-label="Geri">${SV.no}</button><span class="pr">${tl(pr)}</span><button class="ic" data-a="buy" aria-label="Bilet al">${SV.go}</button></div>
   <p class="note">Tarih, süre ve fiyatlar örnektir.</p></div></div>`;
  let q=2,sel=0;
  const draw=()=>{bu.innerHTML=`<div class="dw"><div class="hd"><h2>${esc(p.t)}</h2><p class="sub">Bilet</p></div><div class="bd">
   <div><dt>TARİH</dt><div class="ds" style="margin-top:10px">${ds.map((d,n)=>`<button data-d="${n}" aria-pressed="${n===sel}">${d} · 20.30</button>`).join('')}</div></div>
   <div><dt>ADET</dt><div class="qt" style="margin-top:10px"><button data-q="-1" aria-label="Azalt">−</button><span>${q}</span><button data-q="1" aria-label="Artır">+</button></div></div>
   <div class="tot"><span>Toplam</span><b>${tl(q*pr)}</b></div><button class="go" data-a="pay">Satın al</button><p class="msg" id="msg"></p></div></div>`};
  draw();
  bu.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.d){sel=+b.dataset.d;draw()}else if(b.dataset.q){q=clamp(q+ +b.dataset.q,1,10);draw()}else if(b.dataset.a==='pay')$('#msg').textContent='Prototip: ödeme adımı bağlı değil.'};
  dt.onclick=e=>{const b=e.target.closest('button');if(!b)return;b.dataset.a==='buy'?lvl(2):lvl(0)};
}

/* ---------- giriş: işaretçi, dokunma, sıkıştırma ---------- */
let drag=null,pts=new Map(),pinch=null,pinchA={x:0,y:0},wt=0;
plane.addEventListener('pointerdown',e=>{if(busy)return;S.kb=false;anim=null;vel={x:0,y:0};pts.set(e.pointerId,{x:e.clientX,y:e.clientY});plane.setPointerCapture(e.pointerId);
  if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};drag=null}
  else drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()}});
plane.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);pinchA={x:(a.x+b.x)/2,y:(a.y+b.y)/2};CMD.zoomBy(pinch.d/d,pinchA.x,pinchA.y);pinch.d=d;return}
  if(!drag)return;const now=performance.now(),dx=e.clientX-drag.x,dy=e.clientY-drag.y,m=Math.max(1,now-drag.t);
  CMD.pan(dx,dy);vel.x=vel.x*.6+dx/m/Wn(S.n)*.4;vel.y=vel.y*.6+dy/m/Hn(S.n)*.4;drag.x=e.clientX;drag.y=e.clientY;drag.t=now;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6)plane.classList.add('drag')});
const up=e=>{pts.delete(e.pointerId);plane.classList.remove('drag');
  if(pinch){if(pts.size<2){pinch=null;drag=null;vel={x:0,y:0};settle()}return}
  if(!drag)return;const moved=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy),idle=performance.now()-drag.t;drag=null;
  if(moved<6){vel={x:0,y:0};CMD.activate(Math.floor(S.cu+e.clientX/Wn(S.n)),Math.floor(S.cv+e.clientY/Hn(S.n)))}
  else if(idle>80||Math.hypot(vel.x*Wn(S.n),vel.y*Hn(S.n))<.05){vel={x:0,y:0};settle()}};
plane.addEventListener('pointerup',up);plane.addEventListener('pointercancel',up);
/* tekerlek: iki parmak kaydırma = pan, ctrl/⌘ + tekerlek veya trackpad sıkıştırma = yakınlaşma */
plane.addEventListener('wheel',e=>{e.preventDefault();if(busy)return;S.kb=false;anim=null;vel={x:0,y:0};const k=e.deltaMode?16:1;
  if(e.ctrlKey||e.metaKey){pinchA={x:e.clientX,y:e.clientY};CMD.zoomBy(Math.exp(e.deltaY*k*.01),e.clientX,e.clientY)}
  else CMD.pan(-(e.shiftKey&&!e.deltaX?e.deltaY:e.deltaX)*k,-(e.shiftKey&&!e.deltaX?0:e.deltaY)*k);
  clearTimeout(wt);wt=setTimeout(()=>settle(),150)},{passive:false});
zc.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&S.mode==='surface'&&!busy)setLevel(+b.dataset.l)});
function syncZC(){zc.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===S.li))}

/* açık görünüm: kaydırma ve tekerlek */
let od=null,acc={x:0,y:0},lock=0,at=0;
ov.addEventListener('pointerdown',e=>{od={x:e.clientX,y:e.clientY}});
ov.addEventListener('pointerup',e=>{if(!od)return;const dx=e.clientX-od.x,dy=e.clientY-od.y;od=null;if(Math.max(Math.abs(dx),Math.abs(dy))<50)return;
  Math.abs(dx)>Math.abs(dy)?shift(dx<0?1:-1):lvl(depth+(dy<0?1:-1))});
ov.addEventListener('wheel',e=>{e.preventDefault();const now=performance.now();if(now<lock||busy)return;acc.x+=e.deltaX;acc.y+=e.deltaY;
  if(Math.abs(acc.x)>70&&Math.abs(acc.x)>Math.abs(acc.y)){shift(acc.x>0?1:-1);acc={x:0,y:0};lock=now+900}
  else if(Math.abs(acc.y)>70){lvl(depth+(acc.y>0?1:-1));acc={x:0,y:0};lock=now+900}
  clearTimeout(at);at=setTimeout(()=>acc={x:0,y:0},180)},{passive:false});

/* ---------- giriş: klavye ve TV kumandası ---------- */
const BACK=new Set(['Escape','Backspace','BrowserBack','GoBack']),BACKC=new Set([10009,461]);
addEventListener('keydown',e=>{
  const k=e.key,c=e.keyCode,isBack=BACK.has(k)||BACKC.has(c),zin=k==='+'||k==='='||k==='PageUp'||c===427,zout=k==='-'||k==='PageDown'||c===428;
  if(S.mode==='open'){const m={ArrowRight:()=>shift(1),ArrowLeft:()=>shift(-1),ArrowDown:()=>lvl(depth+1),ArrowUp:()=>lvl(depth-1)}[k];
    if(m){e.preventDefault();m()}else if(isBack){e.preventDefault();lvl(depth-1)}return}
  const d={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[k];
  if(d){e.preventDefault();CMD.move(...d)}
  else if(k==='Enter'){e.preventDefault();S.kb=true;CMD.ok()}
  else if(zin){e.preventDefault();S.kb=true;CMD.level(1,...fcenter())}
  else if(zout||isBack){e.preventDefault();S.kb=true;CMD.level(-1,...fcenter())}});

let ht=0;function say(t){hint.textContent=t;hint.style.opacity=1;clearTimeout(ht);ht=setTimeout(()=>hint.style.opacity=0,3200)}
function boot(){measure();const off=(S.vh-3*Hn(3))/2/Hn(3);S.n=3;S.li=1;S.cu=0;S.cv=-off;S.focus={i:1,j:0};
  ov.classList.remove('on');fd.style.display='none';S.mode='surface';busy=false;anim=null;rebuild();syncZC()}
let rt=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(boot,150)});
boot();requestAnimationFrame(tick);
say(matchMedia('(pointer:coarse)').matches?'Sürükle · iki parmakla yakınlaş · dokun: aç':'Sürükle · ctrl/⌘ + kaydır veya + / − : yakınlaş · tıkla: aç · oklar ve Enter ile gez');
}

</script>
</body></html>
